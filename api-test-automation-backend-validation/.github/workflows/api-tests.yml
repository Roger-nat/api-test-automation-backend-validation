name: API Test Automation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci_test.db
      API_BASE_URL: http://127.0.0.1:8000
      JWT_SECRET_KEY: ci-only-secret-change-if-deployed
      LLM_API_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests utils

      - name: Compile Python
        run: python -m compileall app tests utils

      - name: Run test suite
        run: pytest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            reports/
            artifacts/
